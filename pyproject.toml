[project]
name = "value-sort"
version = "0.1.0"
description = "Planned offline re-ranker for result sets of Amazon products (2023 metadata). Built so far: credibility-adjusted rating and an audited pack-size extractor."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=2.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_sort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
