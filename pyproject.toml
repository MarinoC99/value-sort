[project]
name = "value-sort"
version = "0.1.0"
description = "Offline re-ranker for Amazon search results: credibility-adjusted rating, normalized unit price, review attributes."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_sort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
